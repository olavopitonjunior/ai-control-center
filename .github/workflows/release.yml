name: Release

on:
  push:
    tags:
      - "v*"

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build MSI + publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/surface/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the release on the same checks CI runs, so a tag can never ship
      # code that fails typecheck or tests.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build Tauri app (MSI installer)
        run: pnpm --filter @acc/surface exec tauri build --bundles msi

      - name: Publish release with MSI
        uses: softprops/action-gh-release@v2
        with:
          files: apps/surface/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
