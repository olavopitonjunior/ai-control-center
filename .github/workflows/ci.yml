name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build Surface frontend
        run: pnpm --filter @acc/surface build

  tauri-build:
    name: Tauri native build (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/surface/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # windows-latest already provides MSVC C++ build tools and the WebView2 runtime.
      # --no-bundle compiles + links the native app (release .exe) without building
      # installers, which validates the native build without the bundler/signing overhead.
      - name: Build Tauri app
        run: pnpm --filter @acc/surface exec tauri build --no-bundle
